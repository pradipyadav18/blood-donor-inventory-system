<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bank Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🩸 Blood Donor & Inventory Management</h1>
            <p>Centralized Digital Portal for Blood Availability</p>
        </header>

        <div class="grid-layout">
            <!-- Register Section -->
            <div class="card">
                <h2>Register New Donor</h2>
                <form id="donorForm">
                    <input type="text" id="name" placeholder="Full Name" required>
                    <select id="bloodGroup" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="O+">O+</option>
                        <option value="B+">B+</option>
                        <option value="AB+">AB+</option>
                        <option value="A-">A-</option>
                        <option value="O-">O-</option>
                    </max-option>
                    </select>
                    <input type="number" id="age" placeholder="Age" required>
                    <input type="text" id="contact" placeholder="Contact Number" required>
                    <button type="submit">Add Donor Record</button>
                </form>
            </div>

            <!-- Search Section -->
            <div class="card">
                <h2>Quick Availability Search</h2>
                <div class="search-box">
                    <input type="text" id="searchGroup" placeholder="Enter Blood Group (e.g. O+)">
                    <button onclick="searchDonors()">Search Inventory</button>
                </div>
                <ul id="donorList" class="donor-list"></ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
